spring.application.name=cert-expiry-backend
server.port=8080

# OFFICE REPLICATION: replace these placeholders with the office Oracle values.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:CERT_MONITOR}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Mail values will be supplied through environment variables.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

app.alert.critical-days=30
app.scheduler.certificate-check-cron=0 0 8 * * *
